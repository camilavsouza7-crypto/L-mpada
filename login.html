<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">

 <title>Login</title>

<link rel="stylesheet" href="login.css">
</head>

<body>

 <main class="login-container">

 <div class="login-card">

<h1>LOGIN</h1>

 <p class="subtitulo">
 Faça login para acessar
 </p>

<form id="loginForm">

<div class="campo">

 <label for="usuario">
 Usuário
</label>

 <input
 type="text"
 id="usuario"
 placeholder="Digite seu usuário"
 required
 >

 </div>


 <div class="campo">

<label for="senha">
 Senha
 </label>

 <input
 type="password"
 id="senha"
 placeholder="Digite sua senha"
 required
 >

 </div>


<button type="submit">
ENTRAR
</button>

<p id="mensagem"></p>

</form>

 </div>

                  </main>

<script src="./login.js"></script>
</body>

</html>
